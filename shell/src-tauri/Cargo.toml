[package]
name = "AIPunch"
version = "0.2.3"
description = "AIPunch Desktop Shell"
authors = ["AIPunch"]
license = "MIT"
repository = "https://github.com/clzwqoii/aipunch"
edition = "2024"
rust-version = "1.90"
default-run = "AIPunch"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "AIPunch"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }
