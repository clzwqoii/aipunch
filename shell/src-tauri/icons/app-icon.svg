<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Big Sur / Sequoia Squircle Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="48%" stop-color="#131F3A" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0" />
    </radialGradient>

    <!-- Top Glass Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Squircle Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Energy Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Outer Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.85" />
    </linearGradient>

    <!-- Checkmark Main Gradient -->
    <linearGradient id="checkGrad" x1="15%" y1="85%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="42%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Checkmark Facet Highlight -->
    <linearGradient id="checkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow for Squircle -->
    <filter id="squircleShadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.55" />
    </filter>

    <!-- Neon Glow for Ring & Check -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main macOS Squircle Body (824x824 centered at 512,512) -->
  <g filter="url(#squircleShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" />
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#ambientGlow)" />
    <!-- Top Curved Glass Reflection -->
    <path d="M 285 100 L 739 100 C 841 100 924 183 924 285 L 924 430 Q 512 520 100 430 L 100 285 C 100 183 183 100 285 100 Z" fill="url(#glassSheen)" />
    <!-- Squircle Specular Rim -->
    <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="url(#rimGrad)" stroke-width="8" />
  </g>

  <!-- Subtle Recessed Inner Disc -->
  <circle cx="512" cy="512" r="290" fill="#080D1A" fill-opacity="0.55" stroke="#1E293B" stroke-width="3" />

  <!-- Outer Tech Pulse Orbit -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="url(#orbitGrad)" stroke-width="5" stroke-dasharray="220 48 140 60 280 70" stroke-linecap="round" transform="rotate(-35 512 512)" />

  <!-- Orbit Nodes -->
  <circle cx="512" cy="244" r="9" fill="#67E8F9" />
  <circle cx="744" cy="378" r="8" fill="#34D399" />
  <circle cx="322" cy="702" r="7" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="701" cy="701" r="6" fill="#10B981" fill-opacity="0.75" />

  <!-- MainGlowing Check-in Progress Ring (Open Arc for Checkmark Breakthrough) -->
  <g filter="url(#neonGlow)">
    <circle cx="512" cy="512" r="212" fill="none" stroke="url(#ringGrad)" stroke-width="34" stroke-linecap="round" stroke-dasharray="1090 300" transform="rotate(18 512 512)" />
  </g>

  <!-- Inner Subtle Ring Track -->
  <circle cx="512" cy="512" r="172" fill="none" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="3" />

  <!-- 3D Faceted Checkmark / Punch Badge -->
  <g filter="url(#neonGlow)">
    <!-- Shadow/Base of Checkmark -->
    <path d="M 382 516 L 478 612 L 708 364 L 650 310 L 478 494 L 436 454 Z" fill="url(#checkGrad)" stroke="#A7F3D0" stroke-width="4" stroke-linejoin="round" />
    <!-- Upper Specular Facet of Checkmark -->
    <path d="M 382 516 L 436 454 L 478 494 L 650 310 L 679 337 L 478 552 Z" fill="url(#checkFacet)" />
  </g>
</svg>
