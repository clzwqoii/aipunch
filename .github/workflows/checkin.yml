name: 每日签到

on:
  schedule:
    # cron 使用 UTC。每小时整点触发，由首个「定时窗口」step 比对 repo 变量
    # AIPUNCH_CHECKIN_HOUR / AIPUNCH_CHECKIN_TZ（默认 11 · Asia/Shanghai，即北京时间 11:00），
    # 不匹配则整轮跳过（桌面端「⚙ 配置 → 定时」或 ci-checkin --set-schedule 修改变量）。
    # 整点触发是为支持任意小时配置；GitHub 整点排队延迟通常在分钟级，跨小时错过概率极低。
    - cron: '0 * * * *'
    # 注意：GitHub 对 60 天无活动的仓库会停用定时工作流，偶尔手动触发一次即可保活
  workflow_dispatch: # 手动触发：Actions 页面 → Run workflow；桌面端「一键签到」走这里
    inputs:
      provider:
        description: '只跑指定 Provider（可选，如 trae）'
        required: false
        default: ''
      account:
        description: '只跑指定账号名（可选，如 main）'
        required: false
        default: ''
      verbose:
        description: '输出 detail 原始响应（排查用，填 1）'
        required: false
        default: ''

# 凭证是单次轮换票：定时与手动（桌面端）必须串行，避免两轮并发互相作废
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      # 定时窗口：每小时触发的 schedule 事件，只有当前小时（按设定时区）匹配 repo 变量才真正执行；
      # workflow_dispatch（桌面端/Actions 页面手动触发）不受时间窗口限制
      - id: gate
        name: 定时窗口（AIPUNCH_CHECKIN_HOUR / AIPUNCH_CHECKIN_TZ）
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发，不校验时间窗口"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="${{ vars.AIPUNCH_CHECKIN_HOUR || '11' }}"
          tz="${{ vars.AIPUNCH_CHECKIN_TZ || 'Asia/Shanghai' }}"
          now=$(TZ="$tz" date +%H)
          if [ "$now" = "$hour" ]; then
            echo "当前 $tz $now:00（匹配设定 $hour），执行签到"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "当前 $tz $now:00，设定 $hour:00，本轮跳过"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: 执行签到
        if: steps.gate.outputs.run == 'true'
        env:
          # 长期凭证从 GitHub Secrets 注入（Settings → Secrets and variables → Actions → New repository secret）
          # Secret 名需与 config.json 中账号的 refreshTokenEnv 一致；每次运行自动刷新 accessToken
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          QODER_REFRESH_TOKEN: ${{ secrets.QODER_REFRESH_TOKEN }}
          CODEARTS_REFRESH_TOKEN: ${{ secrets.CODEARTS_REFRESH_TOKEN }}
          CODEARTS_DPOP_KEY: ${{ secrets.CODEARTS_DPOP_KEY }}
          CODEARTS_CODE_VERIFIER: ${{ secrets.CODEARTS_CODE_VERIFIER }}
          AUTOCLAW_REFRESH_TOKEN: ${{ secrets.AUTOCLAW_REFRESH_TOKEN }}
          AUTOCLAW_INTL_REFRESH_TOKEN: ${{ secrets.AUTOCLAW_INTL_REFRESH_TOKEN }}
          TRAE_REFRESH_TOKEN: ${{ secrets.TRAE_REFRESH_TOKEN }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_MACHINE_ID: ${{ secrets.TRAE_MACHINE_ID }}
          TRAE_USER_ID: ${{ secrets.TRAE_USER_ID }}
          # 可选：对仓库有管理员权限的 PAT，用于自动回写轮换后的 Secret
          GH_PAT: ${{ secrets.GH_PAT }}
          # 桌面端单平台/单账号触发时的过滤参数（workflow_dispatch inputs）
          CHECKIN_PROVIDER: ${{ inputs.provider }}
          CHECKIN_ACCOUNT: ${{ inputs.account }}
          CHECKIN_VERBOSE: ${{ inputs.verbose }}
          CHECKIN_RESULT_FILE: ${{ runner.temp }}/checkin-result.json
        run: |
          # RUNNER_TEMP 是 runner 上下文变量，只能通过 shell 环境变量使用（不能放进 env:）
          export CHECKIN_ROTATED_TOKEN_FILE="$RUNNER_TEMP/rotated-tokens.txt"
          # 任一账号失败时 npm 退出 1；bash -e 会在此中止，轮换值必须无条件回写，
          # 否则成功账号的新 token 丢失，下轮用旧值必然失败（Qoder 10-21 即如此）
          args=()
          if [ -n "$CHECKIN_PROVIDER" ]; then args+=(--provider "$CHECKIN_PROVIDER"); fi
          if [ -n "$CHECKIN_ACCOUNT" ]; then args+=(--account "$CHECKIN_ACCOUNT"); fi
          if [ -n "$CHECKIN_VERBOSE" ]; then args+=(--verbose); fi
          npm run checkin -- "${args[@]}" || status=$?
          if [ -s "$CHECKIN_ROTATED_TOKEN_FILE" ]; then
            if [ -n "$GH_PAT" ]; then
              echo "检测到 refreshToken 轮换，回写 Secret"
              GH_TOKEN="$GH_PAT" bash -c 'while IFS="=" read -r name token; do printf "%s" "$token" | gh secret set "$name"; done < "$CHECKIN_ROTATED_TOKEN_FILE"'
            else
              echo "::warning::refreshToken 已轮换但未配置 GH_PAT Secret，请手动更新 WORKBUDDY_REFRESH_TOKEN"
            fi
          fi
          exit ${status:-0}
      - name: 上传结构化结果
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checkin-result
          path: ${{ runner.temp }}/checkin-result.json
          if-no-files-found: ignore
